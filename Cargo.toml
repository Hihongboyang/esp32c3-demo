[package]
edition      = "2024"
name         = "esp32c3_one"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "esp32c3_one"
path = "./src/bin/main.rs"
test = false
bench = false

[dependencies]
nb = "1"
esp-hal = { version = "~1.2.1", features = ["esp32c3", "unstable"] }

esp-rtos = { version = "0.4.0", features = ["embassy", "esp32c3"] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c3"] }

embassy-executor = { version = "0.10.0", features = [] }
embassy-time = "0.5.0"
esp-backtrace = { version = "0.20.0", features = [
  "esp32c3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.18.0", features = ["esp32c3"] }

critical-section = "1.2.0"
static_cell      = "2.1.1"


[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
